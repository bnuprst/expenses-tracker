# Joins your existing Caddy network. Adjust `caddy` below to the external network Caddy runs on.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses"]
      interval: 10s
      retries: 5

  expenses-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expenses
      DB_USER: expenses
      EB_PRIVATE_KEY_PATH: /run/secrets/enablebanking_key
    secrets:
      - enablebanking_key
    networks: [internal, caddy]

secrets:
  enablebanking_key:
    file: ./secrets/enablebanking.pem

volumes:
  pgdata:

networks:
  internal:
  caddy:
    external: true
